modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    authors = "${mod_author}"
    description = '''
Phoenix Essentials - themed, configurable server essentials (homes, warps, tpa, rtp, kits and more).
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "phoenix_wiki"
    type = "required"
    versionRange = "[0.6.0,)"
    ordering = "NONE"
    side = "BOTH"
