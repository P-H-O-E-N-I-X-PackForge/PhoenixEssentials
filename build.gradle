buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
    maven {
        url = "https://maven.architectury.dev"
    }
    flatDir {
        dir 'libs'
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui')
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    // FTB Teams and Phoenix Guilds - both soft dependencies, same pattern PhoenixChronicles
    // already uses (see GTCEuCompat/TeamKeyResolver there): guarded behind ModList.isLoaded(...)
    // at every call site, only needs to be on the classpath to compile against.
    modCompileOnly("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    modCompileOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")
    modRuntimeOnly("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    modRuntimeOnly("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")
    // FTB Library/Teams both hard-depend on Architectury API - needed at runtime for the dev
    // environment to even load them (not otherwise used by this mod directly).
    modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}")

    modCompileOnly('local:phoenix_guilds:0.1.0')
    modRuntimeOnly('local:phoenix_guilds:0.1.0')

    // FTB Chunks and Phoenix Domains - soft dependencies for claim-protection compat (see
    // net.phoenixvine.essentials.compat), guarded behind ModList.isLoaded(...) at every call site.
    modCompileOnly("dev.ftb.mods:ftb-chunks-forge:${ftbchunks_version}")
    modRuntimeOnly("dev.ftb.mods:ftb-chunks-forge:${ftbchunks_version}")

    modCompileOnly('local:phoenix_domains:0.1.0')
    modRuntimeOnly('local:phoenix_domains:0.1.0')
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license"      : mod_license,
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_url"          : mod_url,
            "mod_author"       : mod_author,
            "forge_version"    : forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
}
