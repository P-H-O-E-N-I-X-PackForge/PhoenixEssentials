plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev' version '2.0.143'
    id 'hc'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
    // the Java half of the hotc-mc 1.21.1 networking layer (HcChannel and friends)
    main.java {
        srcDir '../../PhoenixVineDigital/hotc-mc-1.21.1/java'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "ParchmentMC"
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
    maven {
        url = "https://maven.architectury.dev"
    }
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Repsy"
        url = uri("https://repo.repsy.io/mvn/user75142941/phoenixsuite")
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            gameDirectory = file('run121/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll('--username', 'Phoenixvine')
        }
        client2 {
            client()
            gameDirectory = file('run121/client2')
            programArguments.addAll('--username', 'Dev2')
            jvmArguments.addAll('-Xmx3G')
        }
        server {
            server()
            gameDirectory = file('run121/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll('--nogui')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run121/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = file('run121/data')
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

hotChocolate {
    compilerHome = file("$rootDir/../../PhoenixVineDigital/HotChocolate/build/install/hotchocolate")
    sourceDirs file('src/main/hotc'), file('../../PhoenixVineDigital/hotc-mc-1.21.1')
    driverPackage = 'net.phoenixvine.essentials.hc'
}

// The Hot Chocolate compile loads the Minecraft classes to check `extern` signatures, and 1.21.1's are Java 21 class files.
tasks.withType(JavaExec).matching { it.name.startsWith('hcCompile') }.configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}")
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}")
    runtimeOnly("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}")
    runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}")

    runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}")

    // optional compat mods: their own dependency trees (GregTech, ModularUI, ...) are not needed to run Essentials
    compileOnly("net.phoenixvine.guilds:phoenix-guilds-neoforge:${phoenix_guilds_version}") { transitive = false }

    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftbchunks_version}")
    // Guilds, Domains and FTB Chunks are compile-only here: their login handlers send payloads a game-test mock player cannot
    // receive, which fails every test that creates a mock player. Add them to a normal dev run by hand when needed.
    // (FTB Chunks: its login handler sends a payload a game-test mock player cannot receive)

    compileOnly("net.phoenixvine.domains:phoenix_domains:${phoenix_domains_version}") { transitive = false }

    implementation("net.phoenixvine.wiki:neoforge:${phoenix_wiki_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {

        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license"            : mod_license,
            "mod_id"                 : mod_id,
            "mod_version"            : version,
            "mod_name"               : mod_name,
            "mod_url"                : mod_url,
            "mod_author"             : mod_author,
            "neo_version"            : neo_version,
            "minecraft_version"      : minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "loader_version_range"   : loader_version_range,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "Repsy"
            url = uri("https://repo.repsy.io/mvn/user75142941/phoenixsuite")
            credentials {
                username = project.findProperty("repsyUsername") ?: System.getenv("REPSY_USERNAME")
                password = project.findProperty("repsyPassword") ?: System.getenv("REPSY_PASSWORD")
            }
        }
    }
}
